# Configuracion de Mosquitto para la Practica 4
# Copiar a /opt/homebrew/etc/mosquitto/mosquitto.conf
#
# Ya no hay puerto 1883: la unica forma de hablar con el broker es por TLS en el 8883,
# y ademas con usuario y contraseña (se acabo el allow_anonymous de la practica 3).

listener 8883 0.0.0.0
cafile   /opt/homebrew/etc/mosquitto/certs/ca.crt
certfile /opt/homebrew/etc/mosquitto/certs/server.crt
keyfile  /opt/homebrew/etc/mosquitto/certs/server.key
tls_version tlsv1.2

allow_anonymous false
password_file /opt/homebrew/etc/mosquitto/passwd

persistence true
persistence_location /opt/homebrew/var/mosquitto/
log_dest stdout
log_dest file /opt/homebrew/var/log/mosquitto.log
